[project]
name = "tictactoe"
version = "0.1.0"
description = "A pygame tic-tac-toe"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tictactoe = "tictactoe.game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tictactoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
