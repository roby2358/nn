[project]
name = "shards"
version = "0.1.0"
description = "Evolved neural pilots blast crystal rocks into smaller crystal rocks"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shards = "shards.game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
