[project]
name = "tenks"
version = "0.1.0"
description = "Evolved neural tank crews fight in green and blue teams"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5", "numpy>=1.26", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
