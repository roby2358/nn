[project]
name = "crystalchase"
version = "0.1.0"
description = "Evolved neural pilots race for crystals in a starfield"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5"]

[project.scripts]
crystalchase = "crystalchase.game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crystalchase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
