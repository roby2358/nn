[project]
name = "lander"
version = "0.1.0"
description = "A pygame lunar lander"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5"]

[project.scripts]
lander = "lander.game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
